async function officeRows(kind, buf) {
  if (kind === "word") {
    await loadScript(LIB.word);
    const { value } = await mammoth.extractRawText({ arrayBuffer: buf });
    const rows = []; let cur = "";
    value.split(/\n+/).forEach((para) => { if (cur && cur.length + para.length > 3000) { rows.push(cur); cur = ""; } cur += (cur ? " " : "") + para; });
    if (cur.trim()) rows.push(cur);
    return rows.map((c, i) => ({ page: i + 1, content: c, norm: normKeep(c) }));
  }
  await loadScript(LIB.excel);
  const wb = XLSX.read(buf, { type: "array" });
  return wb.SheetNames.map((n, i) => {
    const c = (n + " : " + XLSX.utils.sheet_to_csv(wb.Sheets[n], { FS: " ; ", blankrows: false }).replace(/\n/g, " | ")).slice(0, 200000);
    return { page: i + 1, content: c, norm: normKeep(c) };
  });
}

const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

async function refreshPush() {
  let st = "unsupported";

  else if (Notification.permission === "denied") st = "denied";
  else {

}
async function enablePush() {

    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) });
    const j = sub.toJSON();
    await sb.from("push_subscriptions").delete().eq("endpoint", j.endpoint);
    const { error } = await sb.from("push_subscriptions").insert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200) });
    if (error && !/duplicate/i.test(error.message || "")) throw error;

  await refreshPush();
}
async function disablePush() {

sb.auth.onAuthStateChange((_ev, session) => {
  if (!session) { S.profil = null; loadedFor = null; showAuth(); return; }

async function boot(session) {
  const { data: p, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();

function ago(d) {

  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  if (s < 172800) return "hier";
  if (s < 7 * 86400) return `il y a ${Math.floor(s / 86400)} jours`;
  return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });

function newsSection() {

function setNewsFile(f) {
  if (!f) return;
  if (!/^(image|video)\//.test(f.type)) return toast("Seules les photos et les vidéos sont acceptées ici.", "err");
  if (f.size > MAX_MB * 1048576) return toast(`Fichier trop lourd (plus de ${MAX_MB} Mo). Pour une vidéo, publiez-la sur YouTube et collez le lien.`, "err");
  const d = S.news.draft; if (d.preview) URL.revokeObjectURL(d.preview);
  d.file = f; d.preview = URL.createObjectURL(f); S.news.composer = true; render(true);
}
async function postNews() {
  const d = S.news.draft, body = d.body.trim(), link = val(d.link);
  if (!body && !link && !d.file) return toast("Écrivez un message, ajoutez un lien ou une photo.", "err");
  if (link && !/^https?:\/\/\S+\.\S+/i.test(link)) return toast("Le lien doit commencer par https:// (copiez-le depuis la barre d'adresse).", "err");
  S.news.busy = true; render(true);
  let media_path = null, media_type = null;
  try {
    if (d.file) {
      media_path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${extOf(d.file.name) || d.file.type.split("/")[1] || "bin"}`;
      media_type = d.file.type.startsWith("video") ? "video" : "image";
      const up = await sb.storage.from("actus").upload(media_path, d.file, { contentType: d.file.type, upsert: false });
      if (up.error) throw up.error;
    }
    const { data: created, error } = await sb.from("news").insert({ body: body || null, link_url: link, media_path, media_type, pinned: d.pinned, author_id: S.profil.id, author_name: S.profil.full_name || S.profil.email }).select("id").single();
    if (error) { if (media_path) await sb.storage.from("actus").remove([media_path]); throw error; }
    if (d.notify && created?.id) {
      sb.functions.invoke("notify-news", { body: { id: created.id } }).then(({ data, error: fe }) => {
        if (fe) toast("Actualité publiée, mais les notifications n'ont pas pu partir.", "err");
        else if (data?.sent) toast(`🔔 Notification envoyée à ${plural(data.sent, "appareil")}.`);
      });
    }
    if (d.preview) URL.revokeObjectURL(d.preview);
    S.news.draft = blankDraft(); S.news.composer = false;
    await loadNews();
    toast("C'est en ligne. Tout le monde peut le lire dès maintenant !");
  } catch (e) { toast("Publication impossible : " + errMsg(e), "err"); }
  finally { S.news.busy = false; render(true); }
}

function greeting(first) {

/* Une phrase par rayon, selon son nom */
const TAGS = [
  [/cong|repos|vacance|absence/, "Le droit de souffler, noir sur blanc."],
  [/forma/, "Apprendre est un droit. Parfois même un plaisir."],
  [/qvt|qualite|bien-etre|bien etre/, "Le bien-être au travail, version signée."],
  [/handi|\bth\b|inclusion/, "L'égalité, article par article."],
  [/classif|salair|remun|emploi|grille/, "Qui fait quoi, et pour combien."],
  [/convention|ccn/, "La bible du quotidien."],
  [/cse|elu|deleg|instance|syndic/, "Pour les élus qui ne lâchent rien."],
  [/sante|securit|ssct|risque/, "Rentrer entier le soir, c'est la base."],
  [/teletrav|horaire|temps/, "Où, quand, combien de temps."],
  [/accord/, "Ce qui a été négocié, et gagné."],
];
const FALLBACK = ["Rangé, classé, prêt à servir.", "De quoi répondre à la direction.", "Tout ce qu'il faut savoir, sans jargon inutile."];

  </div>
  ${wrap(`<div id="lib-list" class="pt-4"></div>`)}`;
}
function renderLibList() {
  const t = terms(S.q);
  const catOk = (d) => !S.cats.size || S.cats.has(d.category || NONE);
  const meta = S.docs.filter((d) => catOk(d) && t.every((x) => norm([d.title, d.reference, d.description, d.category, ...(d.keywords || [])].join(" ")).includes(x)));
  const H = S.hits.q === S.q ? S.hits.byDoc : new Map();
  const list = [...meta, ...S.docs.filter((d) => catOk(d) && !meta.includes(d) && H.has(d.id))];
  if (S.sort === "az") list.sort((a, b) => a.title.localeCompare(b.title, "fr"));
  const loading = S.hits.loading && S.hits.q === S.q;
  const head = S.profil.role === "invite" ? "" : `<div class="mb-3 flex items-center justify-between gap-3"><p class="flex items-center gap-2 text-[15px] text-ink-soft" aria-live="polite">${list.length ? plural(list.length, "texte trouvé", "textes trouvés") : ""}${loading ? `<span class="inline-flex items-center gap-1.5 text-[14px]">${spinner()} on fouille dans les pages…</span>` : ""}</p>
    <div class="flex rounded-xl bg-white p-1 text-[14px] font-semibold ring-1 ring-line" role="group" aria-label="Trier">
      ${[["recent", "Récents"], ["az", "De A à Z"]].map(([k, l]) => `<button data-act="sort" data-s="${k}" aria-pressed="${S.sort === k}" class="rounded-lg px-3 py-1.5 ${S.sort === k ? "bg-ink text-white" : "text-ink-soft"}">${l}</button>`).join("")}
    </div></div>`;
  const one = S.cats.size === 1 && !S.cats.has(NONE) ? [...S.cats][0] : null;
  const shelfBanner = one ? `<div class="mb-4 rounded-[18px] px-4 py-3 text-[15px] font-medium" style="background:${tint(catColor(one))};color:${catColor(one)}">${esc(one)} : ${tagline(one)}</div>` : "";
  $("lib-list").innerHTML = shelfBanner + head + `<div class="space-y-3">${list.map((d) => `<div>${docCard(d)}${hitsBlock(d, H.get(d.id), t)}</div>`).join("") ||
    (loading ? "" : empty("Rien trouvé, même en regardant sous le tapis.", S.q || S.cats.size ? "Essayez un autre mot, ou retirez un filtre." : "", "🧹"))}</div>`;
}
function hitsBlock(d, h, toks) {
  if (!h) return "";
  const col = catColor(d.category), more = h.count - h.pages.length;
  return `<div class="-mt-3 rounded-b-[18px] bg-white/70 px-3 pb-3 pt-6 ring-1 ring-line">
    <p class="mb-1 px-2 text-[14px] font-semibold" style="color:${col}">Trouvé dans le texte, ${plural(h.count, { "p.": "page", partie: "partie", feuille: "feuille" }[unitOf(d)] || "page")}</p>
    <ul>${h.pages.map((x) => `<li><button data-act="openhit" data-id="${d.id}" data-p="${x.page}" class="flex w-full items-start gap-3 rounded-xl p-2 text-left transition hover:bg-white">
      <span class="shrink-0 rounded-lg px-2 py-0.5 text-[13px] font-bold" style="background:${tint(col)};color:${col}">${unitOf(d)} ${x.page}</span>
      <span class="line-clamp-2 text-[14px] leading-snug text-ink-soft">…${marked(String(x.snippet || "").replace(/\s+/g, " ").trim(), toks)}…</span></button></li>`).join("")}</ul>
    ${more > 0 ? `<button data-act="openhit" data-id="${d.id}" data-p="${h.pages[0].page}" class="mt-1 px-2 text-[14px] font-semibold text-blue">Et ${plural(more, "autre page", "autres pages")} : voir dans le document</button>` : ""}
  </div>`;
}
let hitTimer = 0;
function scheduleHits() {
  clearTimeout(hitTimer);
  const q = S.q, toks = terms(q);
  if (S.profil?.role === "invite" || toks.join("").length < 2) { S.hits = { q, byDoc: new Map(), loading: false }; return; }
  if (S.hits.q === q) return;
  S.hits = { q, byDoc: new Map(), loading: true };
  hitTimer = setTimeout(async () => {
    const { data, error } = await sb.rpc("search_pages", { terms: toks });
    if (S.q !== q) return;
    const byDoc = new Map();
    (error ? [] : data || []).forEach((r) => {
      const h = byDoc.get(r.document_id) || { count: Number(r.doc_hits) || 1, pages: [] };
      h.pages.push({ page: r.page, snippet: r.snippet }); byDoc.set(r.document_id, h);
    });
    S.hits = { q, byDoc, loading: false };
    if (S.view === "library") renderLibList();
  }, 280);
}

    : [`Texte indexé : ${plural(d.text_pages, { word: "partie", excel: "feuille" }[kindOf(d.storage_path)] || "page")}`, "text-emerald-700", "Réindexer"];
  return `<div class="mt-2 flex items-center justify-between gap-3 text-[14px]"><span class="${st[1]}">${st[0]}</span>
    <button data-act="index" data-id="${d.id}" ${S.indexing ? "disabled" : ""} class="shrink-0 rounded-xl bg-paper px-3 py-1.5 font-semibold text-ink disabled:opacity-40">${st[2]}</button></div>`;
}

/* ================= TEXTE DES PDF : extraction et indexation ================= */
function joinItems(items) {
  let str = ""; const segs = [];
  items.forEach((it) => {
    if (typeof it.str !== "string") return;
    const x = it.str.replace(/\u0000/g, "");
    segs.push({ it, start: str.length, end: str.length + x.length, s: x });
    str += x; if (it.hasEOL) str += " ";
  });
  return { str, segs };
}
async function extractPages(src, onPage) {
  const pdf = await pdfjsLib.getDocument(src).promise, rows = [];
  try {
    for (let p = 1; p <= pdf.numPages; p++) {
      const { str } = joinItems((await (await pdf.getPage(p)).getTextContent()).items);
      rows.push({ page: p, content: str, norm: normKeep(str) });
      onPage?.(p, pdf.numPages);
    }
  } finally { pdf.destroy(); }
  return rows;
}
const ixErr = (e) => /document_pages|search_pages|text_pages|text_chars/.test(errMsg(e))
  ? "La recherche dans le texte n'est pas encore activée dans la base : exécutez le script SQL fourni."
  : "Indexation impossible : " + errMsg(e);
async function indexDoc(d, file) {
  S.indexing = { id: d.id }; renderAdmin();
  try {
    const kind = kindOf(d.storage_path) || "pdf";
    let src;
    if (file) src = { data: new Uint8Array(await file.arrayBuffer()) };
    else { const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(d.storage_path, 900); if (error) throw error; src = data.signedUrl; }
    const rows = kind === "pdf"
      ? await extractPages(src, (p, n) => { const el = $("ix-" + d.id); if (el) el.innerHTML = `${spinner()} Lecture du texte… page ${p} sur ${n}`; })
      : await officeRows(kind, src.data ? src.data.buffer : await (await fetch(src)).arrayBuffer());
    let r = await sb.from("document_pages").delete().eq("document_id", d.id); if (r.error) throw r.error;
    const filled = rows.filter((x) => x.content.trim().length > 0);
    for (let i = 0; i < filled.length; i += 40) {
      r = await sb.from("document_pages").insert(filled.slice(i, i + 40).map((x) => ({ document_id: d.id, ...x })));
      if (r.error) throw r.error;
    }
    const chars = filled.reduce((a, x) => a + x.content.trim().length, 0);
    r = await sb.from("documents").update({ text_pages: filled.length, text_chars: chars }).eq("id", d.id); if (r.error) throw r.error;
    S.hits = { q: "", byDoc: new Map(), loading: false };
    return { pages: filled.length, total: rows.length };
  } finally { S.indexing = null; }
}

/* ================= PUBLICATION ================= */
const cleanName = (n) => {
  const ext = extOf(n) || "pdf";
  let base = n.replace(/\.[a-z0-9]+$/i, "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.\- ]+/g, "-").replace(/\s+/g, " ").trim() || "document";
  return `${base}.${ext}`;
};
const uniqueName = (n) => {
  if (!S.files.includes(n)) return n;
  const ext = extOf(n), base = n.replace(/\.[a-z0-9]+$/i, ""); let i = 2;
  while (S.files.includes(`${base}-${i}.${ext}`)) i++;
  return `${base}-${i}.${ext}`;
};
const titleFrom = (n) => n.replace(/\.[a-z0-9]+$/i, "").replace(/_+/g, " ").replace(/\s+/g, " ").trim();
const val = (x) => { x = String(x ?? "").trim(); return x && x.toLowerCase() !== "null" ? x : null; };
const kwParse = (s) => [...new Set(String(s || "").split(",").map((k) => k.trim().toLowerCase()).filter(Boolean))];
const blankItem = () => ({ title: "", category: "", reference: "", keywords: "", description: "", is_public: false, status: "idle", err: "" });

function addFiles(list) {
  let skipped = 0;
  [...list].forEach((f) => {
    if (/\.doc$/i.test(f.name)) { toast(`« ${f.name} » : les anciens fichiers .doc ne sont pas lisibles. Enregistrez-le en .docx depuis Word.`, "err"); return; }
    if (!kindOf(f.name)) { skipped++; return; }
    if (f.size > MAX_MB * 1048576) { toast(`« ${f.name} » dépasse ${MAX_MB} Mo. Compressez-le avant de le déposer.`, "err"); return; }
    S.queue.push({ ...blankItem(), file: f, title: titleFrom(f.name) });
  });
  if (skipped) toast(`${plural(skipped, "fichier ignoré", "fichiers ignorés")} : formats acceptés PDF, Word (.docx), Excel (.xlsx, .xls, .csv).`, "err");
  S.adminTab = "documents"; renderAdmin();
}
async function setPublic(id, on) {
  if (on) { const r = await sb.from("documents").update({ is_public: false }).eq("is_public", true).neq("id", id); if (r.error) return r.error; }
  return (await sb.from("documents").update({ is_public: on }).eq("id", id)).error;
}
async function publish() {
  if (S.queue.filter((q) => q.is_public).length > 1) return toast("Un seul document de découverte est possible.", "err");
  S.busy = true; renderAdmin();
  let ok = 0, ixFail = 0, noText = 0;
  for (const q of S.queue) {
    if (!q.title.trim()) { q.status = "err"; q.err = "Ajoutez un titre."; continue; }
    q.status = "busy"; q.err = ""; renderAdmin();
    let path = q.existing, uploaded = false;
    try {
      if (!path) {
        path = uniqueName(cleanName(q.file.name));
        const { error } = await sb.storage.from(BUCKET).upload(path, q.file, { contentType: MIME[extOf(path)] || q.file.type || "application/octet-stream", upsert: false });
        if (error) throw error;
        uploaded = true; S.files.push(path);
      }
      const { data, error } = await sb.from("documents").insert({
        title: q.title.trim(), category: val(q.category), reference: val(q.reference),
        description: val(q.description), keywords: kwParse(q.keywords), storage_path: path, is_public: false,
      }).select("id").single();
      if (error) throw error;
      if (q.is_public) { const e = await setPublic(data.id, true); if (e) throw e; }
      try { const ix = await indexDoc({ id: data.id, storage_path: path }, q.file); if (!ix.pages) noText++; } catch { ixFail++; }
      q.status = "done"; ok++;
    } catch (e) {
      if (uploaded) { await sb.storage.from(BUCKET).remove([path]); S.files = S.files.filter((f) => f !== path); }
      q.status = "err"; q.err = errMsg(e);
    }
  }
  S.queue = S.queue.filter((q) => q.status !== "done");
  S.busy = false;
  await loadDocs(); renderAdmin();
  if (ok) toast(ok > 1 ? `${ok} documents publiés. Les collègues vont pouvoir réviser !` : "Document publié. Les collègues vont pouvoir réviser !");
  if (ixFail) toast(`${plural(ixFail, "document publié", "documents publiés")}, mais le texte n'a pas pu être indexé : bouton « Indexer » dans la liste.`, "err");
  if (noText) toast(`${plural(noText, "PDF sans texte lisible", "PDF sans texte lisible")} (scanné ?) : la recherche dans le texte ne le trouvera pas.`, "err");
}

function layoutPages() {

function clearMarks() {

function findOffice(re) {
  clearMarks();
  const walker = document.createTreeWalker($("v-box"), NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) if (!walker.currentNode.parentElement.closest("nav")) nodes.push(walker.currentNode);
  const hits = [];
  nodes.forEach((node) => {
    const txt = node.nodeValue, n = normKeep(txt), ms = []; let m;
    re.lastIndex = 0;
    while ((m = re.exec(n))) { if (!m[0].length) { re.lastIndex++; continue; } ms.push([m.index, m.index + m[0].length]); }
    if (!ms.length) return;
    const sec = node.parentElement.closest("[data-p]"), frag = document.createDocumentFragment(); let pos = 0;
    ms.forEach(([a, b]) => {
      frag.append(txt.slice(pos, a));
      const mk = document.createElement("mark"); mk.className = "fx"; mk.textContent = txt.slice(a, b); frag.append(mk);
      hits.push({ el: mk, p: sec ? +sec.dataset.p : 1, snip: txt.slice(Math.max(0, a - 50), b + 70) });
      pos = b;
    });
    frag.append(txt.slice(pos)); node.replaceWith(frag);
  });
  return hits;
}
function zoom(dir) {

}

async function pageText(p) {
  if (V.find.text[p]) return V.find.text[p];
  const page = await V.pdf.getPage(p), vp = page.getViewport({ scale: 1 });
  const { str, segs } = joinItems((await page.getTextContent()).items);
  return (V.find.text[p] = { str, n: normKeep(str), segs, vp });
}
function rectsFor(t, a, b) {
  const out = [];
  t.segs.forEach((g) => {
    const s0 = Math.max(a, g.start), e0 = Math.min(b, g.end);
    if (s0 >= e0 || !g.s.length) return;
    const tx = pdfjsLib.Util.transform(t.vp.transform, g.it.transform);
    const h = Math.hypot(tx[2], tx[3]) || 10, cw = (g.it.width || h * 0.5 * g.s.length) / g.s.length;
    const x = tx[4] + cw * (s0 - g.start), y = tx[5] - h * 0.95;
    out.push({ l: x / t.vp.width * 100, t: y / t.vp.height * 100, w: cw * (e0 - s0) / t.vp.width * 100, h: h * 1.25 / t.vp.height * 100 });
  });
  return out;
}
function paint(el) {

  const p = +el.dataset.p;
  V.find.hits.forEach((h, i) => {

    h.rects.forEach((r) => {
      const m = document.createElement("div");
      m.className = "hl" + (i === V.find.cur ? " on" : "");
      m.style.cssText = `left:${r.l}%;top:${r.t}%;width:${r.w}%;height:${r.h}%`;
      el.appendChild(m);
    });
  });
}

    <span class="shrink-0 rounded-lg bg-amber-300 px-2 py-0.5 text-[13px] font-bold text-ink">${V.office === "excel" ? "feuille " + h.p : V.office === "word" ? i + 1 : "p. " + h.p}</span>
    <span class="line-clamp-2 text-[14px] leading-snug text-white/85">…${marked(h.snip.replace(/\s+/g, " ").trim(), toks)}…</span></button>`).join("")
    + (H.length > 80 ? `<p class="px-2 py-1 text-[13px] text-white/60">Et ${H.length - 80} autres : utilisez les flèches.</p>` : "");
}
async function runFind(q, wantPage) {
  const tok = ++V.find.tok, toks = terms(q);
  V.find.q = q; V.find.hits = []; V.find.cur = -1; paintAll(); if (V.office) clearMarks();
  $("v-hits").innerHTML = ""; $("v-hits").classList.remove("hidden");
  if (!toks.length || !(V.pdf || V.office)) { $("v-count").textContent = ""; return; }
  // « 29.3 » ne doit pas trouver « 129.30 » : pas de chiffre collé avant ou après
  const re = new RegExp(toks.map((x, i) => (i === 0 && /^\d/.test(x) ? "(?<!\\d)" : "") + reEsc(x) + (i === toks.length - 1 && /\d$/.test(x) ? "(?!\\d)" : "")).join("\\s*"), "g");
  if (V.office) {
    V.find.hits = findOffice(re);
    if (!V.find.hits.length) { $("v-count").textContent = "0"; $("v-hits").innerHTML = `<p class="px-2 py-2 text-[14px] text-white/75">Aucune occurrence. Essayez une autre écriture.</p>`; return; }
    let j = 0;
    if (wantPage && V.office === "excel") { const k = V.find.hits.findIndex((h) => h.p >= wantPage); if (k >= 0) j = k; }
    return goHit(j, !wantPage);
  }
  let pages = null;

    dbToks.forEach((x) => { qb = qb.like("norm", `%${x}%`); });
    const { data, error } = await qb.order("page");

  }
  if (tok !== V.find.tok) return;

  for (let k = 0; k < pages.length; k++) {
    if (tok !== V.find.tok || !V.pdf) return;
    if (k % 8 === 0 && pages.length > 8) $("v-count").textContent = `${Math.round(k / pages.length * 100)} %`;
    const p = pages[k], t = await pageText(p);
    re.lastIndex = 0; let m;
    while ((m = re.exec(t.n))) {
      if (!m[0].length) { re.lastIndex++; continue; }
      const a = m.index, b = a + m[0].length;

    }
  }
  if (tok !== V.find.tok) return;
  if (!V.find.hits.length) {
    $("v-count").textContent = "0";
    $("v-hits").innerHTML = `<p class="px-2 py-2 text-[14px] text-white/75">Aucune occurrence. Essayez une autre écriture : 29.3, art. 29, ou un mot du titre.</p>`;
    return;
  }
  let i = 0;
  if (wantPage) { const j = V.find.hits.findIndex((h) => h.p >= wantPage); if (j >= 0) i = j; }
  goHit(i, !wantPage);
}
function goHit(i, keepList = false) {
  const H = V.find.hits; if (!H.length) return;
  V.find.cur = ((i % H.length) + H.length) % H.length;
  const h = H[V.find.cur];
  $("v-count").textContent = `${V.find.cur + 1} / ${H.length}`;
  $("v-hits").classList.toggle("hidden", !keepList);
  renderHitList(); paintAll();
  if (V.office) {
    $("v-box").querySelectorAll("mark.fx.on").forEach((x) => x.classList.remove("on"));
    h.el.classList.add("on");
    h.el.scrollIntoView({ block: "center", inline: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    return;
  }
  const el = $("v-box").querySelector(`.page[data-p="${h.p}"]`); if (!el) return;
  const r = h.rects[0], sc = $("v-scroll");
  const y = el.offsetTop + (r ? r.t / 100 * el.offsetHeight : 0) - sc.clientHeight * 0.3;
  sc.scrollTo({ top: Math.max(0, y), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
let findTimer = 0;

/* ================= ÉVÉNEMENTS ================= */
const focusSearch = () => setTimeout(() => $("q")?.focus(), 60);
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case "authmode": setAuthMode(t.dataset.m); break;
    case "go": S.view = t.dataset.v; if (t.dataset.t) S.adminTab = t.dataset.t; render(); if (t.dataset.focus) focusSearch(); break;
    case "kw": S.q = t.dataset.k; S.cats.clear(); S.view = "library"; render(); break;
    case "shelf": S.cats = new Set([t.dataset.c]); S.q = ""; S.view = "library"; render(); break;
    case "atab": S.adminTab = t.dataset.t; S.editing = null; render(); break;
    case "open": {
      const d = S.docs.find((x) => x.id === id); if (!d) break;
      const h = S.view === "library" && S.q && S.hits.q === S.q ? S.hits.byDoc.get(id) : null;
      openDoc(d, h ? { q: S.q, page: h.pages[0].page } : {});
      break;
    }
    case "openhit": { const d = S.docs.find((x) => x.id === id); if (d) openDoc(d, { q: S.q, page: +t.dataset.p }); break; }
    case "vfind": if ($("v-find").classList.contains("hidden")) showFind(); else hideFind(); break;
    case "vprev": goHit(V.find.cur - 1); break;
    case "vnext": goHit(V.find.cur + 1); break;
    case "vgo": goHit(+t.dataset.i); break;
    case "vlist": if (V.find.hits.length) $("v-hits").classList.toggle("hidden"); break;
    case "index": {
      const d = S.docs.find((x) => x.id === id); if (!d || S.indexing) break;
      try {
        const r = await indexDoc(d);
        toast(r.pages ? `Texte indexé : ${plural(r.pages, "page")} sur ${r.total}. La recherche le trouve maintenant.` : "Aucun texte lisible dans ce fichier (PDF scanné ?).", r.pages ? "ok" : "err");
      } catch (err) { toast(ixErr(err), "err"); }
      await loadDocs(); renderAdmin(); break;
    }
    case "indexAll": {
      if (S.indexing) break;
      const todo = S.docs.filter((d) => d.text_pages == null && S.files.includes(d.storage_path));
      let okN = 0, scan = 0;
      for (const d of todo) {
        try { const r = await indexDoc(d); r.pages ? okN++ : scan++; }
        catch (err) { toast(ixErr(err), "err"); break; }
      }
      await loadDocs(); renderAdmin();
      if (okN) toast(`${plural(okN, "document indexé", "documents indexés")}. On peut chercher dans le texte !`);
      if (scan) toast(`${plural(scan, "PDF sans texte lisible", "PDF sans texte lisible")} (scanné ?).`, "err");
      break;
    }
    case "vclose": closeDoc(); break;
    case "vsheet": $("sheet-" + t.dataset.i)?.scrollIntoView({ block: "start", behavior: "smooth" }); break;
    case "nopen": S.news.composer = true; render(true); setTimeout(() => $("n-body")?.focus(), 30); break;
    case "ncancel": if (S.news.draft.preview) URL.revokeObjectURL(S.news.draft.preview); S.news.draft = blankDraft(); S.news.composer = false; render(true); break;
    case "npick": $("news-file").click(); break;
    case "nunfile": { const d = S.news.draft; if (d.preview) URL.revokeObjectURL(d.preview); d.file = null; d.preview = null; render(true); break; }
    case "npost": if (!S.news.busy) await postNews(); break;
    case "pushOn": await enablePush(); break;
    case "pushOff": await disablePush(); break;
    case "pushLater": try { localStorage.setItem("fo_push_later", "1"); } catch {} render(true); toast("C'est noté. L'option reste disponible dans votre profil."); break;
    case "nmore": S.news.limit += 20; await loadNews(); render(true); break;
    case "npin": {
      const n = S.news.list.find((x) => x.id === id); if (!n) break;
      const { error } = await sb.from("news").update({ pinned: !n.pinned }).eq("id", id);
      if (error) { toast(errMsg(error), "err"); break; }
      await loadNews(); render(true); toast(n.pinned ? "Actualité désépinglée" : "Actualité épinglée en haut du fil");
      break;
    }
    case "ndel": {
      const n = S.news.list.find((x) => x.id === id); if (!n) break;
      if (!(await ask("Supprimer cette actualité ? Elle disparaîtra du fil pour tout le monde.", "Supprimer"))) break;
      const { error } = await sb.from("news").delete().eq("id", id);
      if (error) { toast(errMsg(error), "err"); break; }
      if (n.media_path) await sb.storage.from("actus").remove([n.media_path]);
      await loadNews(); render(true); toast("Actualité supprimée");
      break;
    }
    case "install": if (installEvt) { installEvt.prompt(); const r = await installEvt.userChoice; if (r.outcome === "accepted") installEvt = null; render(); } break;
    case "installLater": try { localStorage.setItem("fo_install_later", "1"); } catch {} render(); toast("C'est noté. L'option reste disponible dans votre profil."); break;
    case "zoom": zoom(+t.dataset.z); break;
    case "logout": if (await ask("Déjà ? Les textes vous attendront sagement.", "Se déconnecter")) await sb.auth.signOut(); break;
    case "clearq": S.q = ""; render(); focusSearch(); break;
    case "clearcats": S.cats.clear(); render(); break;
    case "sort": S.sort = t.dataset.s; renderLibList(); break;
    case "request": {
      const { error } = await sb.rpc("request_adherent");
      if (error) return toast(errMsg(error), "err");
      S.profil.requested_adherent = true; render(); toast("Demande envoyée. La région s'en occupe, vous n'avez plus rien à faire.");
      break;
    }
    case "approve": case "reject": {
      const ids = [...S.sel]; if (!ids.length) return;
      if (a === "reject" && !(await ask(`Refuser ${plural(ids.length, "demande")} ? Les comptes concernés resteront invités.`, "Refuser"))) return;
      let { error } = await sb.rpc("decide_members", { ids, approve: a === "approve" });
      if (error && /decide_members/.test(error.message || "") && isOwner()) {
        const patch = a === "approve" ? { role: "adherent", requested_adherent: false } : { requested_adherent: false };
        ({ error } = await sb.from("profiles").update(patch).in("id", ids));
      }
      if (error) return toast(errMsg(error), "err");
      S.sel.clear(); await loadAdmin(); render();
      toast(a === "approve" ? (ids.length > 1 ? `Bienvenue au club : ${ids.length} adhérents validés` : "Bienvenue au club : adhérent validé") : (ids.length > 1 ? "Demandes refusées" : "Demande refusée"));
      break;
    }
    case "pick": $("file-in").click(); break;
    case "unqueue": S.queue.splice(+t.dataset.i, 1); renderAdmin(); break;
    case "declare": S.queue.push({ ...blankItem(), existing: t.dataset.f, title: titleFrom(t.dataset.f) }); renderAdmin(); break;
    case "publish": if (!S.busy) await publish(); break;
    case "edit": S.editing = id; renderAdmin(); break;
    case "cancelEdit": S.editing = null; renderAdmin(); break;
    case "saveEdit": {
      const v = (k) => $("e-" + k).value.trim();
      if (!v("title")) return toast("Ajoutez un titre.", "err");
      const { error } = await sb.from("documents").update({
        title: v("title"), category: val(v("category")), reference: val(v("reference")),
        description: val(v("description")), keywords: kwParse(v("keywords")),
      }).eq("id", id);
      if (error) return toast(errMsg(error), "err");
      S.editing = null; await loadDocs(); renderAdmin(); toast("Modifications enregistrées");
      break;
    }
    case "del": {
      const d = S.docs.find((x) => x.id === id); if (!d) return;
      if (!(await ask(`Supprimer « ${d.title} » ? Le fichier sera aussi retiré du stockage.`, "Supprimer"))) return;
      const { error } = await sb.from("documents").delete().eq("id", id);
      if (error) return toast(errMsg(error), "err");
      if (!S.docs.some((x) => x.id !== id && x.storage_path === d.storage_path) && S.files.includes(d.storage_path)) {
        const r = await sb.storage.from(BUCKET).remove([d.storage_path]);
        if (r.error) toast("Fiche supprimée, mais le fichier reste dans le stockage : " + errMsg(r.error), "err");
      }
      await Promise.all([loadDocs(), loadAdmin()]); renderAdmin(); toast("Document supprimé");
      break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "v-q" && e.key === "Enter") {
    e.preventDefault(); clearTimeout(findTimer);
    if (V.find.q === e.target.value && V.find.hits.length) goHit(V.find.cur + (e.shiftKey ? -1 : 1));
    else runFind(e.target.value);
    return;
  }
  if (e.key === "Escape" && !$("viewer").classList.contains("hidden")) { if (!$("v-find").classList.contains("hidden")) hideFind(); else closeDoc(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.id === "dropzone") { e.preventDefault(); $("file-in").click(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.id === "n-drop") { e.preventDefault(); $("news-file").click(); }
});

document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.id === "file-in") { addFiles(t.files); t.value = ""; return; }
  if (t.dataset.cat !== undefined) { t.checked ? S.cats.add(t.dataset.cat) : S.cats.delete(t.dataset.cat); render(); return; }
  if (t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); renderAdmin(); return; }
  if (t.hasAttribute("data-selall")) { pending().forEach((u) => t.checked ? S.sel.add(u.id) : S.sel.delete(u.id)); renderAdmin(); return; }
  if (t.dataset.q !== undefined && t.type === "checkbox") {
    S.queue.forEach((q, i) => { if (t.checked && i !== +t.dataset.q) q.is_public = false; });
    S.queue[+t.dataset.q].is_public = t.checked; renderAdmin(); return;
  }
  if (t.dataset.pub) {
    const err = await setPublic(t.dataset.pub, t.checked);
    if (err) { toast(errMsg(err), "err"); t.checked = !t.checked; return; }
    await loadDocs(); renderAdmin(); toast(t.checked ? "Document de découverte défini" : "Document réservé aux adhérents");
    return;
  }
  if (t.id === "news-file") { setNewsFile(t.files[0]); t.value = ""; return; }
  if (t.id === "n-pin") { S.news.draft.pinned = t.checked; return; }
  if (t.id === "n-notify") { S.news.draft.notify = t.checked; return; }
  if (t.dataset.role) {
    const m = S.members.find((x) => x.id === t.dataset.role);
    if (t.value === "gestionnaire" && !(await ask(`Nommer ${m?.full_name || m?.email || "ce membre"} administrateur ? Il pourra gérer le fil, les documents, les adhésions et passer les membres d'invité à adhérent. Vous seul pouvez nommer ou retirer un administrateur et supprimer des documents.`, "Nommer administrateur"))) { t.value = m?.role || "adherent"; return; }
    const { error } = await sb.from("profiles").update({ role: t.value, requested_adherent: false }).eq("id", t.dataset.role);
    if (error) { t.value = m?.role || "adherent"; return toast(/gestionnaire/.test(error.message || "") ? "Le rôle Administrateur n'est pas encore activé : exécutez le script SQL v7." : errMsg(error), "err"); }
    await loadAdmin(); renderNav(); renderAdmin(); toast(`Statut modifié : ${ROLES[t.value]}`);
  }
});

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; scheduleHits(); renderLibList(); return; }
  if (t.id === "v-q") { clearTimeout(findTimer); const v = t.value; findTimer = setTimeout(() => runFind(v), 400); return; }
  if (t.id === "mq") { S.memberQ = t.value; const pos = t.selectionStart; renderAdmin(); const n = $("mq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === "n-body") { S.news.draft.body = t.value; return; }
  if (t.id === "n-link") { S.news.draft.link = t.value; return; }
  if (t.dataset.q !== undefined && t.type !== "checkbox") S.queue[+t.dataset.q][t.dataset.f] = t.value;
});

/* Glisser-déposer */
const hasFiles = (e) => e.dataTransfer?.types?.includes("Files");
const inDrop = () => S.view === "admin" && S.adminTab === "documents";
const inNewsDrop = () => S.view === "home" && isStaff() && S.news.composer && !S.news.off;
["dragenter", "dragover"].forEach((ev) => addEventListener(ev, (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); // empêche le navigateur d'ouvrir le PDF
  if (inDrop()) $("dropzone")?.classList.add("drag");
  if (inNewsDrop()) $("n-drop")?.classList.add("drag");
}));
addEventListener("dragleave", (e) => { if (!e.relatedTarget) { $("dropzone")?.classList.remove("drag"); $("n-drop")?.classList.remove("drag"); } });
addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  $("dropzone")?.classList.remove("drag"); $("n-drop")?.classList.remove("drag");
  if (inNewsDrop()) return setNewsFile(e.dataTransfer.files[0]);
  if (inDrop()) addFiles(e.dataTransfer.files);
  else if (isAdmin()) { S.view = "admin"; S.adminTab = "documents"; render(); addFiles(e.dataTransfer.files); }
});
let lastW = innerWidth;
addEventListener("resize", () => { if (V.pdf && Math.abs(innerWidth - lastW) > 40) { lastW = innerWidth; V.tok++; layoutPages(); } });
</script>
