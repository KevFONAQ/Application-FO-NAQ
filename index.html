function toast(msg, type = "ok") {
  const el = document.createElement("div");
  el.className = `enter pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-2xl px-4 py-3.5 text-[15px] font-medium shadow-xl ${type === "err" ? "bg-ink text-white" : "bg-white text-ink ring-1 ring-line"}`;

  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 4000);

function ask(msg, ok = "Confirmer") {
  return new Promise((res) => {
    $("modal-msg").textContent = msg; $("modal-ok").textContent = ok;
    $("modal").classList.remove("hidden"); $("modal").classList.add("flex");
    const close = (v) => { $("modal").classList.add("hidden"); $("modal").classList.remove("flex"); res(v); };
    $("modal-ok").onclick = () => close(true); $("modal-no").onclick = () => close(false);
  });

/* Récemment consultés : stockés sur l'appareil uniquement */
const recentKey = () => `fo_recent_${S.profil?.id}`;
const getRecent = () => { try { return JSON.parse(localStorage.getItem(recentKey()) || "[]"); } catch { return []; } };
const pushRecent = (id) => { try { localStorage.setItem(recentKey(), JSON.stringify([id, ...getRecent().filter((x) => x !== id)].slice(0, 6))); } catch {} };

/* Mots-clés les plus fréquents : raccourcis de recherche */
function topKeywords(n = 8) {
  const c = new Map();
  S.docs.forEach((d) => (d.keywords || []).forEach((k) => { const key = k.trim().toLowerCase(); if (key) c.set(key, (c.get(key) || 0) + 1); }));
  return [...c.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "fr")).slice(0, n).map(([k]) => k);
}

/* ================= AUTHENTIFICATION ================= */
function setAuthMode(m) {
  authMode = m;
  const on = "bg-white text-ink shadow-sm", off = "text-ink-soft";
  $("m-login").className = `rounded-xl py-3 ${m === "login" ? on : off}`;
  $("m-signup").className = `rounded-xl py-3 ${m === "signup" ? on : off}`;
  $("f-login").classList.toggle("hidden", m !== "login");
  $("f-signup").classList.toggle("hidden", m !== "signup");
}
function showAuth() { $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); setAuthMode(authMode); }

async function withBusy(btn, label, fn) {
  const old = btn.innerHTML; btn.disabled = true;
  btn.innerHTML = `<span class="inline-flex items-center gap-2">${spinner("w-5 h-5")} ${label}</span>`;
  try { await fn(); } finally { btn.disabled = false; btn.innerHTML = old; }
}
$("f-login").onsubmit = (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  withBusy(e.target.querySelector("button"), "Connexion…", async () => {
    const { error } = await sb.auth.signInWithPassword({ email: f.get("email"), password: f.get("password") });
    if (error) toast(errMsg(error), "err");
  });
};
$("f-signup").onsubmit = (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  withBusy(e.target.querySelector("button"), "Création…", async () => {
    const { data, error } = await sb.auth.signUp({ email: f.get("email"), password: f.get("password"), options: { data: { full_name: f.get("name") } } });
    if (error) return toast(errMsg(error), "err");
    if (!data.session) { toast("Compte créé. Confirmez votre email (pensez aux courriers indésirables), puis connectez-vous."); setAuthMode("login"); }
  });
};

sb.auth.onAuthStateChange((_ev, session) => {
  if (!session) { S.profil = null; loadedFor = null; showAuth(); return; }
  if (loadedFor === session.user.id) return;
  loadedFor = session.user.id;
  setTimeout(() => boot(session), 0); // évite le blocage du callback Supabase
});

async function boot(session) {
  const { data: p, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !p) return toast("Profil introuvable : " + (error?.message || "contactez l'administrateur."), "err");
  S.profil = p; S.view = "home";
  await loadDocs();
  if (isAdmin()) await loadAdmin();
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  render();
}

/* ================= DONNÉES ================= */
async function loadDocs() {
  const { data, error } = await sb.from("documents").select("*").order("created_at", { ascending: false });
  if (error) toast(errMsg(error), "err");
  S.docs = data || [];
}
async function loadAdmin() {
  const [m, f] = await Promise.all([
    sb.from("profiles").select("id,email,full_name,role,requested_adherent,requested_at,created_at").order("created_at", { ascending: false }),
    sb.storage.from(BUCKET).list("", { limit: 1000, sortBy: { column: "name", order: "asc" } }),
  ]);
  S.members = m.data || [];
  S.files = (f.data || []).filter((o) => o.id && !o.name.startsWith(".")).map((o) => o.name);
  [...S.sel].forEach((id) => { if (!pending().some((u) => u.id === id)) S.sel.delete(id); });
}

/* Chaque rubrique a sa couleur et son ton */
const THEME = {

const deco = (c) => `<svg class="pointer-events-none absolute -right-12 -top-10 h-56 w-56" viewBox="0 0 200 200" aria-hidden="true"><circle cx="118" cy="82" r="72" fill="${c}" opacity=".13"/><circle cx="52" cy="150" r="30" fill="${c}" opacity=".2"/><rect x="138" y="136" width="40" height="40" rx="11" fill="${c}" opacity=".28" transform="rotate(18 158 156)"/></svg>`;

const pick = (a) => a[Math.floor(Math.random() * a.length)];
function greeting(first) {
  const h = new Date().getHours(), n = first ? " " + esc(first) : "";
  if (h < 5)  return [`Encore debout${n} ?`, "Le droit du travail, lui, ne dort jamais."];
  if (h < 12) return [`Bonjour${n}`, "Un café, puis un petit article ?"];
  if (h < 14) return [`Bon appétit${n}`, "Une lecture légère pour la digestion ?"];
  if (h < 18) return [`Bon après-midi${n}`, "Un article pour la route ?"];
  return [`Bonsoir${n}`, "Une dernière lecture avant de couper ?"];
}
/* Une phrase par rayon, selon son nom */
const TAGS = [
  [/cong|repos|vacance|absence/, "Le droit de souffler, noir sur blanc."],
  [/forma/, "Apprendre est un droit. Parfois même un plaisir."],
  [/qvt|qualite|bien-etre|bien etre/, "Le bien-être au travail, version signée."],
  [/handi|\bth\b|inclusion/, "L'égalité, article par article."],
  [/classif|salair|remun|emploi|grille/, "Qui fait quoi, et pour combien."],
  [/convention|ccn/, "La bible du quotidien."],
  [/cse|elu|deleg|instance|syndic/, "Pour les élus qui ne lâchent rien."],
  [/sante|securit|ssct|risque/, "Rentrer entier le soir, c'est la base."],
  [/teletrav|horaire|temps/, "Où, quand, combien de temps."],
  [/accord/, "Ce qui a été négocié, et gagné."],
];
const FALLBACK = ["Rangé, classé, prêt à servir.", "De quoi répondre à la direction.", "Tout ce qu'il faut savoir, sans jargon inutile."];
const tagline = (c) => { const n = norm(c); for (const [r, t] of TAGS) if (r.test(n)) return t; let h = 0; for (const ch of c) h = (h + ch.charCodeAt(0)) % FALLBACK.length; return FALLBACK[h]; };
const tint = (hex, a = "1F") => hex + a;
const wrap = (html, cls = "") => `<div class="mx-auto max-w-2xl px-4 ${cls}">${html}</div>`;

/* ================= PUBLICATION ================= */
const cleanName = (n) => {
  let s = n.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.\- ]+/g, "-").replace(/\s+/g, " ").trim();
  if (!/\.pdf$/i.test(s)) s += ".pdf";
  return s;
};
const uniqueName = (n) => {
  if (!S.files.includes(n)) return n;
  const base = n.replace(/\.pdf$/i, ""); let i = 2;
  while (S.files.includes(`${base}-${i}.pdf`)) i++;
  return `${base}-${i}.pdf`;
};
const titleFrom = (n) => n.replace(/\.pdf$/i, "").replace(/_+/g, " ").replace(/\s+/g, " ").trim();
const val = (x) => { x = String(x ?? "").trim(); return x && x.toLowerCase() !== "null" ? x : null; };
const kwParse = (s) => [...new Set(String(s || "").split(",").map((k) => k.trim().toLowerCase()).filter(Boolean))];
const blankItem = () => ({ title: "", category: "", reference: "", keywords: "", description: "", is_public: false, status: "idle", err: "" });

function addFiles(list) {
  let skipped = 0;
  [...list].forEach((f) => {
    if (!(f.type === "application/pdf" || /\.pdf$/i.test(f.name))) { skipped++; return; }
    if (f.size > MAX_MB * 1048576) { toast(`« ${f.name} » dépasse ${MAX_MB} Mo. Compressez-le avant de le déposer.`, "err"); return; }
    S.queue.push({ ...blankItem(), file: f, title: titleFrom(f.name) });
  });
  if (skipped) toast(`${plural(skipped, "fichier ignoré", "fichiers ignorés")} : seuls les PDF sont acceptés.`, "err");
  S.adminTab = "documents"; renderAdmin();
}
async function setPublic(id, on) {
  if (on) { const r = await sb.from("documents").update({ is_public: false }).eq("is_public", true).neq("id", id); if (r.error) return r.error; }
  return (await sb.from("documents").update({ is_public: on }).eq("id", id)).error;
}
async function publish() {
  if (S.queue.filter((q) => q.is_public).length > 1) return toast("Un seul document de découverte est possible.", "err");
  S.busy = true; renderAdmin();
  let ok = 0;
  for (const q of S.queue) {
    if (!q.title.trim()) { q.status = "err"; q.err = "Ajoutez un titre."; continue; }
    q.status = "busy"; q.err = ""; renderAdmin();
    let path = q.existing, uploaded = false;
    try {
      if (!path) {
        path = uniqueName(cleanName(q.file.name));
        const { error } = await sb.storage.from(BUCKET).upload(path, q.file, { contentType: "application/pdf", upsert: false });
        if (error) throw error;
        uploaded = true; S.files.push(path);
      }
      const { data, error } = await sb.from("documents").insert({
        title: q.title.trim(), category: val(q.category), reference: val(q.reference),
        description: val(q.description), keywords: kwParse(q.keywords), storage_path: path, is_public: false,
      }).select("id").single();
      if (error) throw error;
      if (q.is_public) { const e = await setPublic(data.id, true); if (e) throw e; }
      q.status = "done"; ok++;
    } catch (e) {
      if (uploaded) { await sb.storage.from(BUCKET).remove([path]); S.files = S.files.filter((f) => f !== path); }
      q.status = "err"; q.err = errMsg(e);
    }
  }
  S.queue = S.queue.filter((q) => q.status !== "done");
  S.busy = false;
  await loadDocs(); renderAdmin();
  if (ok) toast(ok > 1 ? `${ok} documents publiés. Les collègues vont pouvoir réviser !` : "Document publié. Les collègues vont pouvoir réviser !");
}

/* ================= LECTEUR PDF : rendu page par page à l'écran ================= */
const blockCtx = (e) => e.preventDefault();
const blockKeys = (e) => { if ((e.ctrlKey || e.metaKey) && "psu".includes(e.key.toLowerCase())) e.preventDefault(); };
const V = { tok: 0, pdf: null, zoom: 1, ratio: 1.414, obs: null, pageObs: null };
const ZOOMS = [1, 1.35, 1.75, 2.25];

function layoutPages() {
  V.obs?.disconnect(); V.pageObs?.disconnect();
  const box = $("v-box"), avail = $("v-scroll").clientWidth - 24;
  const w = Math.round(Math.min(avail, 900) * V.zoom);
  box.style.width = w + "px"; box.innerHTML = "";
  for (let i = 1; i <= V.pdf.numPages; i++) {
    const el = document.createElement("div");
    el.className = "page"; el.dataset.p = i;
    el.style.width = w + "px"; el.style.height = Math.round(w * V.ratio) + "px";
    box.appendChild(el);
  }
  const tok = V.tok, root = $("v-scroll");
  V.obs = new IntersectionObserver((ents) => ents.forEach((en) => {
    const el = en.target;
    if (en.isIntersecting && !el.dataset.r) renderPage(el, tok);
    else if (!en.isIntersecting && el.dataset.r) { el.innerHTML = ""; delete el.dataset.r; }
  }), { root, rootMargin: "1200px 0px" });
  V.pageObs = new IntersectionObserver((ents) => ents.forEach((en) => {
    if (en.isIntersecting) $("v-page").textContent = `Page ${en.target.dataset.p} sur ${V.pdf.numPages}`;
  }), { root, threshold: 0.5 });
  box.querySelectorAll(".page").forEach((el) => { V.obs.observe(el); V.pageObs.observe(el); });
}
async function renderPage(el, tok) {
  el.dataset.r = "1";
  try {
    const p = await V.pdf.getPage(+el.dataset.p);
    if (tok !== V.tok || !el.dataset.r) return;
    const base = p.getViewport({ scale: 1 }), dpr = Math.min(devicePixelRatio || 1, 2);
    const vp = p.getViewport({ scale: (el.clientWidth / base.width) * dpr });
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    el.style.height = Math.round(el.clientWidth * base.height / base.width) + "px";
    await p.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    if (tok === V.tok && el.dataset.r) { el.innerHTML = ""; el.appendChild(c); }
  } catch { delete el.dataset.r; }
}
async function openDoc(d) {
  const tok = ++V.tok; V.zoom = 1;
  pushRecent(d.id);
  $("viewer").classList.remove("hidden"); $("viewer").classList.add("flex");
  $("v-back").innerHTML = ic("back", "w-6 h-6");
  $("v-title").textContent = d.title; $("v-sub").textContent = d.reference || d.category || "";
  $("v-msg").innerHTML = `<span class="inline-flex items-center gap-2">${spinner("w-5 h-5")} ${pick(["On dépoussière le classeur…", "On chausse nos lunettes…", "On cherche la bonne page…", "Le juriste arrive…"])}</span>`;
  $("v-box").innerHTML = ""; $("v-page").classList.add("hidden");
  addEventListener("contextmenu", blockCtx); addEventListener("keydown", blockKeys);
  try {
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(d.storage_path, 300);
    if (error) throw error;
    const pdf = await pdfjsLib.getDocument(data.signedUrl).promise;
    if (tok !== V.tok) return pdf.destroy();
    V.pdf = pdf;
    const v1 = (await pdf.getPage(1)).getViewport({ scale: 1 }); V.ratio = v1.height / v1.width;
    $("v-sub").textContent = `${d.reference ? d.reference + ", " : ""}${plural(pdf.numPages, "page")}`;
    $("v-msg").textContent = ""; $("v-page").classList.remove("hidden");
    layoutPages();
  } catch (e) { if (tok === V.tok) $("v-msg").textContent = "Impossible d'ouvrir ce document : " + errMsg(e); }
}
function zoom(dir) {
  if (!V.pdf) return;
  const i = Math.max(0, Math.min(ZOOMS.length - 1, ZOOMS.indexOf(V.zoom) + dir));
  if (ZOOMS[i] === V.zoom) return;
  const sc = $("v-scroll"), rel = sc.scrollTop / Math.max(1, sc.scrollHeight);
  V.zoom = ZOOMS[i]; V.tok++; layoutPages();
  sc.scrollTop = rel * sc.scrollHeight;
}
function closeDoc() {
  V.tok++; V.obs?.disconnect(); V.pageObs?.disconnect(); V.pdf?.destroy(); V.pdf = null;
  $("viewer").classList.add("hidden"); $("viewer").classList.remove("flex");
  $("v-box").innerHTML = "";
  removeEventListener("contextmenu", blockCtx); removeEventListener("keydown", blockKeys);
  if (S.view === "home") render();
}

const focusSearch = () => setTimeout(() => $("q")?.focus(), 60);
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case "authmode": setAuthMode(t.dataset.m); break;
    case "go": S.view = t.dataset.v; if (t.dataset.t) S.adminTab = t.dataset.t; render(); if (t.dataset.focus) focusSearch(); break;
    case "kw": S.q = t.dataset.k; S.cats.clear(); S.view = "library"; render(); break;
    case "shelf": S.cats = new Set([t.dataset.c]); S.q = ""; S.view = "library"; render(); break;
    case "atab": S.adminTab = t.dataset.t; S.editing = null; render(); break;
    case "open": { const d = S.docs.find((x) => x.id === id); if (d) openDoc(d); break; }
    case "vclose": closeDoc(); break;
    case "zoom": zoom(+t.dataset.z); break;
    case "logout": if (await ask("Déjà ? Les textes vous attendront sagement.", "Se déconnecter")) await sb.auth.signOut(); break;
    case "clearq": S.q = ""; render(); focusSearch(); break;
    case "clearcats": S.cats.clear(); render(); break;
    case "sort": S.sort = t.dataset.s; renderLibList(); break;
    case "request": {
      const { error } = await sb.rpc("request_adherent");
      if (error) return toast(errMsg(error), "err");
      S.profil.requested_adherent = true; render(); toast("Demande envoyée. La région s'en occupe, vous n'avez plus rien à faire.");
      break;
    }
    case "approve": case "reject": {
      const ids = [...S.sel]; if (!ids.length) return;
      if (a === "reject" && !(await ask(`Refuser ${plural(ids.length, "demande")} ? Les comptes concernés resteront invités.`, "Refuser"))) return;
      const patch = a === "approve" ? { role: "adherent", requested_adherent: false } : { requested_adherent: false };
      const { error } = await sb.from("profiles").update(patch).in("id", ids);
      if (error) return toast(errMsg(error), "err");
      S.sel.clear(); await loadAdmin(); render();
      toast(a === "approve" ? (ids.length > 1 ? `Bienvenue au club : ${ids.length} adhérents validés` : "Bienvenue au club : adhérent validé") : (ids.length > 1 ? "Demandes refusées" : "Demande refusée"));
      break;
    }
    case "pick": $("file-in").click(); break;
    case "unqueue": S.queue.splice(+t.dataset.i, 1); renderAdmin(); break;
    case "declare": S.queue.push({ ...blankItem(), existing: t.dataset.f, title: titleFrom(t.dataset.f) }); renderAdmin(); break;
    case "publish": if (!S.busy) await publish(); break;
    case "edit": S.editing = id; renderAdmin(); break;
    case "cancelEdit": S.editing = null; renderAdmin(); break;
    case "saveEdit": {
      const v = (k) => $("e-" + k).value.trim();
      if (!v("title")) return toast("Ajoutez un titre.", "err");
      const { error } = await sb.from("documents").update({
        title: v("title"), category: val(v("category")), reference: val(v("reference")),
        description: val(v("description")), keywords: kwParse(v("keywords")),
      }).eq("id", id);
      if (error) return toast(errMsg(error), "err");
      S.editing = null; await loadDocs(); renderAdmin(); toast("Modifications enregistrées");
      break;
    }
    case "del": {
      const d = S.docs.find((x) => x.id === id); if (!d) return;
      if (!(await ask(`Supprimer « ${d.title} » ? Le PDF sera aussi retiré du stockage.`, "Supprimer"))) return;
      const { error } = await sb.from("documents").delete().eq("id", id);
      if (error) return toast(errMsg(error), "err");
      if (!S.docs.some((x) => x.id !== id && x.storage_path === d.storage_path) && S.files.includes(d.storage_path)) {
        const r = await sb.storage.from(BUCKET).remove([d.storage_path]);
        if (r.error) toast("Fiche supprimée, mais le PDF reste dans le stockage : " + errMsg(r.error), "err");
      }
      await Promise.all([loadDocs(), loadAdmin()]); renderAdmin(); toast("Document supprimé");
      break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("viewer").classList.contains("hidden")) closeDoc();
  if ((e.key === "Enter" || e.key === " ") && e.target.id === "dropzone") { e.preventDefault(); $("file-in").click(); }
});

document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.id === "file-in") { addFiles(t.files); t.value = ""; return; }
  if (t.dataset.cat !== undefined) { t.checked ? S.cats.add(t.dataset.cat) : S.cats.delete(t.dataset.cat); render(); return; }
  if (t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); renderAdmin(); return; }
  if (t.hasAttribute("data-selall")) { pending().forEach((u) => t.checked ? S.sel.add(u.id) : S.sel.delete(u.id)); renderAdmin(); return; }
  if (t.dataset.q !== undefined && t.type === "checkbox") {
    S.queue.forEach((q, i) => { if (t.checked && i !== +t.dataset.q) q.is_public = false; });
    S.queue[+t.dataset.q].is_public = t.checked; renderAdmin(); return;
  }
  if (t.dataset.pub) {
    const err = await setPublic(t.dataset.pub, t.checked);
    if (err) { toast(errMsg(err), "err"); t.checked = !t.checked; return; }
    await loadDocs(); renderAdmin(); toast(t.checked ? "Document de découverte défini" : "Document réservé aux adhérents");
    return;
  }
  if (t.dataset.role) {
    const { error } = await sb.from("profiles").update({ role: t.value, requested_adherent: false }).eq("id", t.dataset.role);
    if (error) return toast(errMsg(error), "err");
    await loadAdmin(); renderNav(); renderAdmin(); toast(`Statut modifié : ${ROLES[t.value]}`);
  }
});

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; renderLibList(); return; }
  if (t.id === "mq") { S.memberQ = t.value; const pos = t.selectionStart; renderAdmin(); const n = $("mq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.dataset.q !== undefined && t.type !== "checkbox") S.queue[+t.dataset.q][t.dataset.f] = t.value;
});

/* Glisser-déposer */
const hasFiles = (e) => e.dataTransfer?.types?.includes("Files");
const inDrop = () => S.view === "admin" && S.adminTab === "documents";
["dragenter", "dragover"].forEach((ev) => addEventListener(ev, (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); // empêche le navigateur d'ouvrir le PDF
  if (inDrop()) $("dropzone")?.classList.add("drag");
}));
addEventListener("dragleave", (e) => { if (!e.relatedTarget) $("dropzone")?.classList.remove("drag"); });
addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  $("dropzone")?.classList.remove("drag");
  if (inDrop()) addFiles(e.dataTransfer.files);
  else if (isAdmin()) { S.view = "admin"; S.adminTab = "documents"; render(); addFiles(e.dataTransfer.files); }
});
let lastW = innerWidth;
addEventListener("resize", () => { if (V.pdf && Math.abs(innerWidth - lastW) > 40) { lastW = innerWidth; V.tok++; layoutPages(); } });
</script>
