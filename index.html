<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Documentaire FO Nouvelle-Aquitaine</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-200 font-sans">
<div class="mx-auto max-w-[420px] bg-[#f4f5f7] min-h-screen shadow-2xl relative pb-20">
  <header class="bg-[#C8001E] text-white p-5 text-center shadow-md">
    <div class="flex items-center justify-center gap-3">
      <div class="bg-white text-[#C8001E] font-black text-2xl px-3 py-1 rounded border-2 border-[#C8001E]">FO</div>
      <div class="text-left"><h1 class="text-base font-black tracking-wide leading-tight">BASE DOCUMENTAIRE FO</h1><p class="text-sm opacity-90 font-medium">Nouvelle-Aquitaine</p></div>
    </div>
    <div id="role-badge" class="hidden mt-3 inline-block bg-white/20 px-3 py-1 rounded-full text-xs font-bold uppercase"></div>
  </header>
  <div id="auth-screen" class="p-6 mt-10">
    <div class="bg-white p-6 rounded-2xl shadow border border-gray-100">
      <h2 id="auth-title" class="text-xl font-bold text-gray-800 text-center mb-6">Connexion</h2>
      <form onsubmit="gererAuth(event)" class="space-y-4">
        <div id="field-name" class="hidden"><input type="text" id="user-name" placeholder="Nom complet" class="w-full p-3 border rounded-xl text-sm"></div>
        <input type="email" id="user-email" placeholder="Adresse Email" required class="w-full p-3 border rounded-xl text-sm">
        <input type="password" id="user-password" placeholder="Mot de passe" minlength="6" required class="w-full p-3 border rounded-xl text-sm">
        <button type="submit" id="btn-submit" class="w-full bg-[#C8001E] text-white font-bold py-3 rounded-xl shadow text-sm">Se connecter</button>
      </form>
      <button onclick="basculer()" id="btn-switch" class="w-full text-center text-xs text-gray-500 underline mt-4 block">Pas de compte ? Inscription</button>
    </div>
  </div>
  <div id="main-screen" class="hidden p-4 select-none">
    <div id="block-invite" class="bg-amber-50 border border-amber-200 text-amber-900 p-4 rounded-xl mb-4 text-xs hidden">
      <p class="font-bold mb-1 text-sm">🔒 Accès Restreint aux Militants</p>
      <p class="mb-3">Votre demande d'adhésion est reçue. Les fiches juridiques sont réservées aux adhérents validés.</p>
      <button id="btn-req" onclick="demander()" class="w-full bg-[#C8001E] text-white font-bold py-2 rounded-lg text-xs">Demander la validation de mon adhésion FO</button>
    </div>
    <div id="block-search" class="mb-5 hidden"><input type="text" id="search-input" oninput="filtrer()" placeholder="🔍 Rechercher un mot-clé..." class="w-full p-3 border rounded-xl bg-white text-sm"></div>
    <h3 class="text-[11px] text-gray-400 font-bold uppercase mb-3">Fiches juridiques & Accords</h3>
    <div id="docs-list" class="space-y-3"></div>
    <div id="block-admin" class="mt-8 bg-white border-2 border-dashed p-4 rounded-xl hidden">
      <h3 class="text-sm font-bold text-teal-800 mb-2">⚙️ Espace Validation FO</h3>
      <div id="admin-list" class="space-y-2"></div>
    </div>
  </div>
  <nav id="app-nav" class="fixed bottom-0 left-0 right-0 mx-auto max-w-[420px] bg-white border-t flex shadow-lg hidden">
    <button onclick="onglet('docs')" id="n-docs" class="flex-1 py-3 text-xs font-bold text-[#C8001E]">📂 Documents</button>
    <button onclick="onglet('admin')" id="n-admin" class="flex-1 py-3 text-xs font-bold text-gray-400 hidden">⚙️ Admin</button>
    <button onclick="quitter()" class="flex-1 py-3 text-xs font-bold text-gray-400">🚪 Quitter</button>
  </nav>
</div>
<script>
  const supabase = window.supabase.createClient("https://supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsb3RiZ3h6Z3l0cXF0eGtvaXZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjc1NDEsImV4cCI6MjEwNjgwMzU0MX0.1O488-rY6b8VonDbw1IgrXw_X9rSAgOLcVy8lJisX3M");
  let session = null, profil = null, docs = [], mode = 'login', tab = 'docs';
  window.onload = () => { supabase.auth.onAuthStateChange(async (e, s) => { session = s; if (s) { await charger(); } else { ecran('auth'); } }); };
  function basculer() { mode = mode === 'login' ? 'signup' : 'login'; document.getElementById('auth-title').innerText = mode === 'login' ? 'Connexion' : 'Créer mon compte'; document.getElementById('field-name').style.display = mode === 'login' ? 'none' : 'block'; document.getElementById('btn-submit').innerText = mode === 'login' ? 'Se connecter' : 'Créer mon compte'; document.getElementById('btn-switch').innerText = mode === 'login' ? 'Pas de compte ? Inscription' : 'Déjà inscrit ? Se connecter'; }
  async function gererAuth(e) { e.preventDefault(); const email = document.getElementById('user-email').value, pass = document.getElementById('user-password').value; if (mode === 'signup') { const name = document.getElementById('user-name').value; const { error } = await supabase.auth.signUp({ email, password: pass, options: { data: { full_name: name } } }); if (error) alert(error.message); else { alert("Inscription réussie ! Connectez-vous."); basculer(); } } else { const { error } = await supabase.auth.signInWithPassword({ email, password: pass }); if (error) alert("Identifiants incorrects."); } }
  async function charger() { const { data: p } = await supabase.from('profiles').select('*').eq('id', session.user.id).single(); if (p) { profil = p; document.getElementById('role-badge').classList.remove('hidden'); document.getElementById('role-badge').innerText = "Espace " + p.role; if (p.role === 'invite') { document.getElementById('block-invite').classList.remove('hidden'); if (p.requested_adherent) { const b = document.getElementById('btn-req'); b.disabled = true; b.innerText = "⏳ En attente de validation..."; b.className = "w-full bg-gray-400 text-white font-bold py-2 rounded-lg text-xs"; } } else { document.getElementById('block-search').classList.remove('hidden'); if (p.role === 'admin') document.getElementById('n-admin').classList.remove('hidden'); } await chargerDocs(); ecran('app'); } }
  async function demander() { await supabase.from('profiles').update({ requested_adherent: true, requested_at: new Date() }).eq('id', profil.id); alert("Demande envoyée."); location.reload(); }
  async function chargerDocs() { docs = [{ title: "Livret d'accueil des CSE", reference: "FO Régional 2026", description: "Cadre d'action des élus.", is_public: true }, { title: "Crédit d'heures de délégation", reference: "Art. L2315-7", description: "Règles d'utilisation et ripostes.", is_public: false }, { title: "Orientations stratégiques", reference: "Art. L2312-8", description: "Dossier d'analyse face à la direction.", is_public: false }]; filtrer(); if (profil.role === 'admin') await chargerDemandes(); }
  function filtrer() { const q = document.getElementById('search-input').value.toLowerCase(), c = document.getElementById('docs-list'); c.innerHTML = ''; docs.forEach(d => { if (profil.role === 'invite' && !d.is_public) return; if (d.title.toLowerCase().includes(q)) { const div = document.createElement('div'); div.className = "bg-white p-4 rounded-xl border-l-4 border-[#C8001E] shadow-sm"; div.innerHTML = `<h4 class="font-bold text-gray-800 text-sm">${d.title}</h4><p class="text-[10px] text-gray-400 italic mb-2">Réf: ${d.reference}</p><p class="text-xs text-gray-600 mb-3">${d.description}</p><button onclick="alert('Sécurité active (Anti-copie)')" class="w-full bg-slate-800 text-white font-bold py-2 rounded-lg text-xs">👁️ Consulter</button>`; c.appendChild(div); } }); }
  async function chargerDemandes() { const { data: d } = await supabase.from('profiles').select('id, email, full_name').eq('role', 'invite').eq('requested_adherent', true); const c = document.getElementById('admin-list'); c.innerHTML = ''; if (d && d.length > 0) { d.forEach(u => { const div = document.createElement('div'); div.className = "flex items-center justify-between bg-gray-50 p-3 rounded-lg border text-xs gap-2"; div.innerHTML = `<div class="truncate"><p class="font-bold text-gray-800 truncate">${u.full_name || 'Militant'}</p><p class="text-gray-400 truncate">${u.email}</p></div><button onclick="valider('${u.id}')" class="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-md shrink-0">Accepter</button>`; c.appendChild(div); }); } else { c.innerHTML = '<p class="text-xs text-gray-400 italic">Aucune demande.</p>'; } }
  async function valider(id) { const { error } = await supabase.from('profiles').update({ role: 'adherent', requested_adherent: false }).eq('id', id); if (!error) { alert("Militant validé !"); await chargerDemandes(); await chargerDocs(); } }
  function onglet(id) { tab = id; document.getElementById('n-docs').className = id === 'docs' ? "flex-1 py-3 text-xs font-bold text-[#C8001E]" : "flex-1 py-3 text-xs font-bold text-gray-400"; document.getElementById('n-admin').className = id === 'admin' ? "flex-1 py-3 text-xs font-bold text-[#C8001E]" : "flex-1 py-3 text-xs font-bold text-gray-400"; document.getElementById('block-search').style.display = (id === 'docs' && profil.role !== 'invite') ? 'block' : 'none'; document.getElementById('docs-list').style.display = id === 'docs' ? 'block' : 'none'; document.getElementById('block-admin').style.display = id === 'admin' ? 'block' : 'none'; }
  function ecran(t) { document.getElementById('auth-screen').style.display = t === 'auth' ? 'block' : 'none'; document.getElementById('main-screen').style.display = t === 'app' ? 'block' : 'none'; document.getElementById('app-nav').style.display = t === 'app' ? 'flex' : 'none'; }
  async function quitter() { await supabase.auth.signOut(); location.reload(); }
</script>
</body>
</html>
